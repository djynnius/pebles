[workspace]
resolver = "2"
members = ["crates/*", "kernels/sql-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
pebbles-api = { path = "crates/pebbles-api" }
pebbles-identity = { path = "crates/pebbles-identity" }
pebbles-runtime = { path = "crates/pebbles-runtime" }
pebbles-session = { path = "crates/pebbles-session" }

anyhow = "1"
async-trait = "0.1"
libc = "0.2"
pwhash = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = "5"

tempfile = "3"

[profile.release]
strip = true
lto = "thin"
