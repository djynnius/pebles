# Nightly: the REQ-09 upgrade-path test (last published :edge -> current main, same
# volumes, forced schema bump so the pre-migration backup runs every night) and an
# arm64 smoke cell. Design: implementation plan §7.
name: Nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  upgrade-path:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the last published edge image (the "old" release)
        run: docker pull "$IMAGE:edge-amd64"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: pebbles:new
          cache-from: type=gha
      - name: Upgrade path (old edge -> current main)
        run: scripts/ci/upgrade-path.sh "$IMAGE:edge-amd64" pebbles:new

  arm64-smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: pebbles:it
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: install-to-first-query (docker, arm64)
        run: RUNTIME=docker scripts/smoke/install-to-first-query.sh pebbles:it
