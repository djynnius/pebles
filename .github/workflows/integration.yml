# Cross-runtime integration matrix (M0.6+, the Phase 0 exit). Build ONCE, test the
# same digest everywhere (implementation plan §7) — the Airflow/science image is too
# heavy to rebuild per cell. A single job builds and pushes a run-scoped tag to
# GHCR; every matrix cell pulls it and runs the SAME acceptance script,
# scripts/smoke/install-to-first-query.sh.
name: Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "ref=$IMAGE:it-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            ctr: docker
          - runtime: podman # rootful — rootless is refused by design (REQ-11)
            ctr: sudo podman
          - runtime: incus
            ctr: sudo incus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the prebuilt image
        run: docker pull "${{ needs.build.outputs.ref }}"

      - name: Prepare docker
        if: matrix.runtime == 'docker'
        run: docker tag "${{ needs.build.outputs.ref }}" pebbles:it

      - name: Prepare rootful podman
        if: matrix.runtime == 'podman'
        run: |
          docker save "${{ needs.build.outputs.ref }}" | sudo podman load
          sudo podman tag "${{ needs.build.outputs.ref }}" localhost/pebbles:it

      - name: Prepare incus (convert + import the pulled image)
        if: matrix.runtime == 'incus'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus skopeo umoci xz-utils dnsmasq-base
          echo "root:70000:5000" | sudo tee -a /etc/subuid /etc/subgid
          sudo systemctl restart incus
          sudo incus admin init --minimal
          sudo image/lxc/oci-to-incus.sh "${{ needs.build.outputs.ref }}" dist/incus x86_64 it
          sudo incus image import dist/incus/metadata.tar.xz dist/incus/rootfs.tar.xz \
            --alias pebbles-it
          sudo incus profile create pebbles
          printf 'config:\n  raw.idmap: |-\n    both 70000-74999 70000-74999\n' \
            | sudo incus profile edit pebbles

      - name: install-to-first-query (${{ matrix.runtime }}, single-box)
        run: |
          img=pebbles:it
          [ "${{ matrix.runtime }}" = podman ] && img=localhost/pebbles:it
          [ "${{ matrix.runtime }}" = incus ] && img=pebbles-it
          RUNTIME=${{ matrix.runtime }} CTR_CMD="${{ matrix.ctr }}" \
            scripts/smoke/install-to-first-query.sh "$img"

  main-plus-engine:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            ctr: docker
            image: pebbles:it
          - runtime: podman
            ctr: sudo podman
            image: localhost/pebbles:it
          - runtime: incus # duo on the incus bridge: engine join under the idmap profile
            ctr: sudo incus
            image: pebbles-it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "${{ needs.build.outputs.ref }}"
      - name: Prepare image for ${{ matrix.runtime }}
        if: matrix.runtime != 'incus'
        run: |
          if [ "${{ matrix.runtime }}" = podman ]; then
            docker save "${{ needs.build.outputs.ref }}" | sudo podman load
            sudo podman tag "${{ needs.build.outputs.ref }}" localhost/pebbles:it
          else
            docker tag "${{ needs.build.outputs.ref }}" pebbles:it
          fi
      - name: Prepare incus (convert + import the pulled image)
        if: matrix.runtime == 'incus'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends incus skopeo umoci xz-utils dnsmasq-base
          echo "root:70000:5000" | sudo tee -a /etc/subuid /etc/subgid
          sudo systemctl restart incus
          sudo incus admin init --minimal
          sudo image/lxc/oci-to-incus.sh "${{ needs.build.outputs.ref }}" dist/incus x86_64 it
          sudo incus image import dist/incus/metadata.tar.xz dist/incus/rootfs.tar.xz \
            --alias pebbles-it
          sudo incus profile create pebbles
          printf 'config:\n  raw.idmap: |-\n    both 70000-74999 70000-74999\n' \
            | sudo incus profile edit pebbles
      - name: main+engine topology (${{ matrix.runtime }})
        run: |
          RUNTIME=${{ matrix.runtime }} CTR_CMD="${{ matrix.ctr }}" \
            scripts/smoke/main-plus-engine.sh "${{ matrix.image }}"
