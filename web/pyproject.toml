[project]
name = "pebbles-web"
version = "1.1.0"
description = "Pebbles web tier — deliberately thin; every privileged action is a pebblesd API call (NFR-01)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=26",  # --no-control-socket (pebblesd services.rs) needs 26+
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # test-only: the engine-side Excel cleaner (image/rootfs/opt/pebbles/etl)
    # runs on the image's conda env; these mirror its versions for the tests.
    "pandas>=3",
    "openpyxl>=3.1",
    "duckdb>=1.5,<1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pebbles_web"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
