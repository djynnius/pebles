[project]
name = "pebbles-web"
version = "1.1.0"
description = "Pebbles web tier — deliberately thin; every privileged action is a pebblesd API call (NFR-01)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pebbles_web"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
