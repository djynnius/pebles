<!DOCTYPE html>
<html lang="en" data-pb-theme="night">
<head>
  <meta charset="utf-8">
  <title>{{ name }} · pe{b}les</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Dashboard view (REQ-28): rearrangeable tiles fed by saved SQL, run through
       the viewer's own session. Monokai vars; no runtime fetches (NFR-03). */
    [data-pb-theme="night"] {
      --pb-bg: #272822; --pb-fg: #F8F8F2; --pb-accent: #F92672;
      --pb-comment: #75715E; --pb-surface: #1E1F1C; --pb-green: #A6E22E;
      --pb-blue: #66D9EF;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--pb-bg); color: var(--pb-fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif; min-height: 100vh;
    }
    .top {
      display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1.25rem;
      background: var(--pb-surface); font-size: 0.85rem;
    }
    .top .wordmark { font-family: "Cascadia Code", ui-monospace, monospace; }
    .top .wordmark .brace { color: var(--pb-accent); }
    .top .title { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .top .meta { margin-left: auto; display: flex; gap: 0.75rem; color: var(--pb-comment); }
    .top a, .top button {
      color: var(--pb-accent); background: none; border: 0; cursor: pointer;
      font: inherit; text-decoration: none;
    }
    .grid {
      display: grid; gap: 1rem; padding: 1.25rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    .tile { background: var(--pb-surface); border-radius: 10px; overflow: hidden; }
    .tile header {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.85rem; font-size: 0.8rem; color: var(--pb-comment);
    }
    .tile header .controls { margin-left: auto; display: none; gap: 0.3rem; }
    body.editing .tile header .controls { display: flex; }
    .tile header .controls button {
      border: 0; background: var(--pb-bg); color: var(--pb-fg);
      border-radius: 5px; width: 1.6rem; height: 1.6rem; cursor: pointer;
    }
    .tile .body { padding: 0.5rem 0.85rem 0.85rem; min-height: 3rem; font-size: 0.85rem; }
    .tile .stat { font-size: 2.4rem; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--pb-green); }
    .tile table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.78rem; }
    .tile th, .tile td { text-align: left; padding: 0.25rem 0.45rem; border-bottom: 1px solid var(--pb-bg); }
    .tile th { color: var(--pb-comment); }
    .bar-row { display: grid; grid-template-columns: 8rem 1fr 3.5rem; gap: 0.5rem; align-items: center; margin: 0.25rem 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.78rem; }
    .bar-row .bar { height: 0.9rem; background: var(--pb-blue); border-radius: 3px; min-width: 2px; }
    .err { color: var(--pb-accent); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; white-space: pre-wrap; }
    .editor {
      display: none; padding: 1rem 1.25rem; background: var(--pb-surface);
      margin: 0 1.25rem 1.25rem; border-radius: 10px;
    }
    body.editing .editor { display: block; }
    .editor label { display: block; color: var(--pb-comment); font-size: 0.8rem; margin: 0.6rem 0 0.2rem; }
    .editor input, .editor textarea, .editor select {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--pb-comment);
      border-radius: 6px; background: var(--pb-bg); color: var(--pb-fg);
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.85rem;
    }
    .editor button {
      margin-top: 0.75rem; border: 0; border-radius: 6px; padding: 0.45rem 1rem;
      background: var(--pb-accent); color: var(--pb-fg); cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top">
    <span class="wordmark">pe<span class="brace">{</span>b<span class="brace">}</span>les</span>
    <span class="title">{{ name }}</span>
    <span class="meta">
      <span id="state" aria-live="polite"></span>
      <button id="edit-toggle">Edit</button>
      <a href="{{ url_for('dashboards_page') }}">all dashboards</a>
      <span>{{ user.username }}</span>
      <a href="{{ url_for('logout') }}">sign out</a>
    </span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="editor">
    <strong>Add tile</strong>
    <label for="t-title">Title</label>
    <input id="t-title">
    <label for="t-kind">Kind</label>
    <select id="t-kind">
      <option value="table">table</option>
      <option value="stat">stat (single value)</option>
      <option value="bars">bars (label, value)</option>
    </select>
    <label for="t-sql">SQL</label>
    <textarea id="t-sql" rows="3" spellcheck="false"></textarea>
    <label for="catalog">Catalog</label>
    <select id="catalog">
      <option value="">(none)</option>
      {% for c in catalogs %}
        <option value="{{ c.name }}" {{ 'selected' if dashboard.catalog == c.name }}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <button id="add-tile">Add tile</button>
    <button id="save">Save dashboard</button>
  </div>
  <script>
    const dash = {{ dashboard | tojson }};
    const grid = document.getElementById("grid");
    const state = document.getElementById("state");
    const saveUrl = "{{ url_for('dashboard_save', name=name) }}";
    const streamBase = "{{ url_for('dashboards_page') }}/{{ name }}/tiles/";

    function render() {
      grid.replaceChildren();
      dash.tiles.forEach((tile, i) => {
        const el = document.createElement("section");
        el.className = "tile";
        el.innerHTML = `
          <header><span>${tile.title || "(untitled)"}</span>
            <span class="controls">
              <button data-act="left" title="move earlier">◀</button>
              <button data-act="right" title="move later">▶</button>
              <button data-act="remove" title="remove">✕</button>
            </span></header>
          <div class="body"></div>`;
        el.querySelectorAll(".controls button").forEach(btn =>
          btn.addEventListener("click", () => {
            const act = btn.dataset.act;
            if (act === "remove") dash.tiles.splice(i, 1);
            if (act === "left" && i > 0) [dash.tiles[i-1], dash.tiles[i]] = [dash.tiles[i], dash.tiles[i-1]];
            if (act === "right" && i < dash.tiles.length - 1) [dash.tiles[i+1], dash.tiles[i]] = [dash.tiles[i], dash.tiles[i+1]];
            render(); refresh();
          }));
        grid.appendChild(el);
      });
    }

    function renderTile(body, tile, rows) {
      body.replaceChildren();
      if (tile.kind === "stat") {
        const v = rows.length ? Object.values(rows[0])[0] : "—";
        const div = document.createElement("div");
        div.className = "stat"; div.textContent = String(v);
        body.appendChild(div);
      } else if (tile.kind === "bars") {
        const max = Math.max(1, ...rows.map(r => Number(Object.values(r)[1]) || 0));
        rows.forEach(r => {
          const [label, value] = Object.values(r);
          const row = document.createElement("div");
          row.className = "bar-row";
          row.innerHTML = `<span></span><div class="bar"></div><span></span>`;
          row.children[0].textContent = String(label);
          row.children[1].style.width = (100 * (Number(value) || 0) / max) + "%";
          row.children[2].textContent = String(value);
          body.appendChild(row);
        });
      } else {
        const table = document.createElement("table");
        if (rows.length) {
          const cols = Object.keys(rows[0]);
          const head = table.createTHead().insertRow();
          cols.forEach(c => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
          const tbody = table.createTBody();
          rows.slice(0, 50).forEach(r => { const tr = tbody.insertRow(); cols.forEach(c => tr.insertCell().textContent = String(r[c])); });
        }
        body.appendChild(table);
      }
    }

    function refresh() {
      state.textContent = dash.tiles.length ? "refreshing…" : "no tiles yet — Edit to add one";
      dash.tiles.forEach((tile, i) => {
        const body = grid.children[i].querySelector(".body");
        const source = new EventSource(streamBase + i + "/stream");
        source.addEventListener("result", ev => { renderTile(body, tile, JSON.parse(ev.data).rows || []); state.textContent = ""; });
        source.addEventListener("error", ev => {
          if (!ev.data) return;
          body.replaceChildren();
          const pre = document.createElement("pre");
          pre.className = "err"; pre.textContent = JSON.parse(ev.data).error;
          body.appendChild(pre);
        });
        source.addEventListener("done", () => source.close());
      });
    }

    async function save() {
      dash.catalog = document.getElementById("catalog").value || null;
      state.textContent = "saving…";
      await fetch(saveUrl, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(dash) });
      state.textContent = "saved";
      refresh();
    }

    document.getElementById("edit-toggle").addEventListener("click", () =>
      document.body.classList.toggle("editing"));
    document.getElementById("add-tile").addEventListener("click", () => {
      dash.tiles.push({
        title: document.getElementById("t-title").value,
        kind: document.getElementById("t-kind").value,
        sql: document.getElementById("t-sql").value,
      });
      document.getElementById("t-title").value = "";
      document.getElementById("t-sql").value = "";
      render(); save();
    });
    document.getElementById("save").addEventListener("click", save);

    render();
    refresh();
  </script>
</body>
</html>
