<!DOCTYPE html>
<html lang="en" data-pb-theme="night">
<head>
  <meta charset="utf-8">
  <title>pe{b}les</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Design system (spec §6): Monokai via custom properties on [data-pb-theme];
       no hard-coded colours in components. Fonts are system-fallback until the
       IBM Plex / Cascadia files are bundled — nothing is ever fetched at runtime
       (NFR-03). */
    [data-pb-theme="night"] {
      --pb-bg: #272822;
      --pb-fg: #F8F8F2;
      --pb-accent: #F92672;
      --pb-comment: #75715E;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--pb-bg);
      color: var(--pb-fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .wordmark {
      font-family: "Cascadia Code", ui-monospace, monospace;
      font-size: 3rem;
    }
    .wordmark .brace { color: var(--pb-accent); }
    .status { color: var(--pb-comment); margin-top: 0.75rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">pe<span class="brace">{</span>b<span class="brace">}</span>les</h1>
    <p class="status">Phase 0 scaffold — the workbench arrives with milestone M0.5.</p>
  </main>
</body>
</html>
