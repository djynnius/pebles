<!DOCTYPE html>
<html lang="en" data-pb-theme="night">
<head>
  <meta charset="utf-8">
  <title>pe{b}les</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Design system (spec §6): Monokai via custom properties on [data-pb-theme];
       no hard-coded colours in components. Fonts are system-fallback until the
       IBM Plex / Cascadia files are bundled — nothing is ever fetched at runtime
       (NFR-03). */
    [data-pb-theme="night"] {
      --pb-bg: #272822;
      --pb-fg: #F8F8F2;
      --pb-accent: #F92672;
      --pb-comment: #75715E;
      --pb-surface: #1E1F1C;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--pb-bg);
      color: var(--pb-fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .wordmark {
      font-family: "Cascadia Code", ui-monospace, monospace;
      font-size: 3rem;
      text-align: center;
    }
    .wordmark .brace { color: var(--pb-accent); }
    .status { color: var(--pb-comment); margin-top: 0.75rem; font-size: 0.9rem; text-align: center; }
    .card {
      background: var(--pb-surface);
      border-radius: 10px;
      padding: 2rem 2.5rem;
      min-width: 320px;
    }
    label { display: block; color: var(--pb-comment); font-size: 0.85rem; margin: 1rem 0 0.25rem; }
    input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--pb-comment);
      border-radius: 6px;
      background: var(--pb-bg);
      color: var(--pb-fg);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--pb-accent); border-color: transparent; }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 6px;
      background: var(--pb-accent);
      color: var(--pb-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .error { color: var(--pb-accent); margin-top: 0.75rem; font-size: 0.9rem; }
    a { color: var(--pb-accent); }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
