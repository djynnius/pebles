<!DOCTYPE html>
<html lang="en" data-pb-theme="night">
<head>
  <meta charset="utf-8">
  <title>{{ name }} · pe{b}les</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Workbench shell v1 (REQ-29/30): 46px icon rail, folding panel, document
       tab bar; below 1280px the panel overlays with a scrim instead of pushing.
       Monokai via custom properties; nothing fetched at runtime (NFR-03). */
    [data-pb-theme="night"] {
      --pb-bg: #272822; --pb-fg: #F8F8F2; --pb-accent: #F92672;
      --pb-comment: #75715E; --pb-surface: #1E1F1C; --pb-green: #A6E22E;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--pb-bg); color: var(--pb-fg);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      height: 100vh; display: flex; overflow: hidden;
    }
    .rail {
      width: 46px; flex: none; background: var(--pb-surface);
      display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 4px;
    }
    .rail button, .rail a {
      width: 34px; height: 34px; border: 0; border-radius: 8px;
      background: transparent; color: var(--pb-comment); font-size: 1rem;
      display: grid; place-items: center; cursor: pointer; text-decoration: none;
    }
    .rail .active { color: var(--pb-accent); background: var(--pb-bg); }
    .panel {
      width: 240px; flex: none; background: var(--pb-surface);
      border-left: 1px solid var(--pb-bg); padding: 1rem; overflow-y: auto;
    }
    .panel h3 { font-size: 0.8rem; color: var(--pb-comment); text-transform: uppercase; margin-bottom: 0.75rem; }
    .panel a { display: block; color: var(--pb-fg); text-decoration: none; padding: 0.3rem 0.4rem; border-radius: 6px; font-size: 0.9rem; }
    .panel a.current, .panel a:hover { background: var(--pb-bg); color: var(--pb-accent); }
    .panel[hidden] { display: none; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs {
      height: 38px; flex: none; display: flex; align-items: stretch;
      background: var(--pb-surface); font-size: 0.85rem;
    }
    .tabs .tab {
      display: flex; align-items: center; padding: 0 1rem; gap: 0.5rem;
      background: var(--pb-bg); border-top: 2px solid var(--pb-accent);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .tabs .meta { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem; color: var(--pb-comment); }
    .tabs .meta a { color: var(--pb-accent); }
    .cells { flex: 1; overflow-y: auto; padding: 1.25rem; }
    .cell { background: var(--pb-surface); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
    .cell header {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.75rem;
      font-size: 0.75rem; color: var(--pb-comment);
    }
    .cell header .type { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .cell header button { margin-left: auto; border: 0; border-radius: 6px; padding: 0.25rem 0.8rem; background: var(--pb-accent); color: var(--pb-fg); cursor: pointer; font-size: 0.75rem; }
    .cell textarea {
      width: 100%; border: 0; resize: vertical; min-height: 4.5rem;
      background: var(--pb-surface); color: var(--pb-fg); padding: 0 0.9rem 0.6rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.9rem;
    }
    .cell textarea:focus { outline: none; }
    .cell .out { border-top: 1px solid var(--pb-bg); padding: 0.6rem 0.9rem; font-size: 0.85rem; }
    .cell .out:empty { display: none; }
    .cell .out pre { font-family: "IBM Plex Mono", ui-monospace, monospace; white-space: pre-wrap; }
    .cell .out .err { color: var(--pb-accent); }
    .cell .out table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; }
    .cell .out th, .cell .out td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--pb-bg); }
    .cell .out th { color: var(--pb-comment); }
    .toolbar { padding: 0 1.25rem 1.25rem; display: flex; gap: 0.6rem; }
    .toolbar button, .toolbar select {
      border: 1px solid var(--pb-comment); border-radius: 6px; padding: 0.35rem 0.9rem;
      background: var(--pb-surface); color: var(--pb-fg); cursor: pointer; font-size: 0.85rem;
    }
    .scrim { display: none; }
    @media (max-width: 1279px) {
      .panel { position: fixed; left: 46px; top: 0; bottom: 0; z-index: 20; }
      .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 10; }
    }
  </style>
</head>
<body>
  <nav class="rail" aria-label="workbench">
    <button id="files-btn" class="active" title="Files">▤</button>
    <a href="{{ url_for('sql_editor') }}" title="SQL">Ⅲ</a>
    <a href="{{ url_for('catalogs_page') }}" title="Catalog">◫</a>
    <a href="{{ url_for('index') }}" title="Home">⌂</a>
  </nav>
  <aside class="panel" id="panel">
    <h3>Notebooks</h3>
    <a href="{{ url_for('notebooks_page') }}">← all notebooks</a>
    <a class="current" href="#">{{ name }}</a>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="tabs">
      <div class="tab">{{ name }}.json</div>
      <div class="meta">
        <span id="state" aria-live="polite">saved</span>
        <span>{{ user.username }}</span>
        <a href="{{ url_for('logout') }}">sign out</a>
      </div>
    </div>
    <div class="cells" id="cells"></div>
    <div class="toolbar">
      <button id="add-sql">+ SQL cell</button>
      <button id="add-python">+ Python cell</button>
      <button id="add-r">+ R cell</button>
      <select id="catalog">
        <option value="">catalog: (none)</option>
        {% for c in catalogs %}
          <option value="{{ c.name }}" {{ 'selected' if notebook.catalog == c.name }}>catalog: {{ c.name }}</option>
        {% endfor %}
      </select>
      <button id="save">Save</button>
    </div>
  </div>
  <script>
    const nb = {{ notebook | tojson }};
    const cellsEl = document.getElementById("cells");
    const state = document.getElementById("state");
    const saveUrl = "{{ url_for('notebook_save', name=name) }}";
    const streamBase = "{{ url_for('notebooks_page') }}/{{ name }}/cells/";

    function render() {
      cellsEl.replaceChildren();
      nb.cells.forEach((cell, i) => {
        const el = document.createElement("section");
        el.className = "cell";
        el.innerHTML = `
          <header><span class="type">${cell.type}</span><button>Run</button></header>
          <textarea spellcheck="false"></textarea>
          <div class="out"></div>`;
        const ta = el.querySelector("textarea");
        ta.value = cell.source;
        ta.addEventListener("input", () => { cell.source = ta.value; state.textContent = "unsaved"; });
        el.querySelector("button").addEventListener("click", () => runCell(i, el.querySelector(".out")));
        cellsEl.appendChild(el);
      });
    }

    async function save() {
      nb.catalog = document.getElementById("catalog").value || null;
      state.textContent = "saving…";
      await fetch(saveUrl, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(nb) });
      state.textContent = "saved";
    }

    async function runCell(i, out) {
      await save();
      out.replaceChildren();
      state.textContent = "running…";
      const source = new EventSource(streamBase + i + "/stream");
      source.addEventListener("result", (ev) => {
        const r = JSON.parse(ev.data);
        if (r.rows !== undefined) {
          const rows = r.rows || [];
          const table = document.createElement("table");
          if (rows.length) {
            const cols = Object.keys(rows[0]);
            const head = table.createTHead().insertRow();
            cols.forEach(c => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
            const body = table.createTBody();
            rows.forEach(row => { const tr = body.insertRow(); cols.forEach(c => tr.insertCell().textContent = String(row[c])); });
          }
          out.appendChild(table);
          state.textContent = rows.length + " row(s)";
        } else {
          if (r.stdout) { const pre = document.createElement("pre"); pre.textContent = r.stdout; out.appendChild(pre); }
          if (r.stderr) { const pre = document.createElement("pre"); pre.className = "err"; pre.textContent = r.stderr; out.appendChild(pre); }
          state.textContent = "done";
        }
      });
      source.addEventListener("error", (ev) => {
        if (!ev.data) return;
        const pre = document.createElement("pre");
        pre.className = "err";
        pre.textContent = JSON.parse(ev.data).error;
        out.appendChild(pre);
        state.textContent = "error";
      });
      source.addEventListener("done", () => source.close());
    }

    document.getElementById("add-sql").addEventListener("click", () => { nb.cells.push({type: "sql", source: ""}); render(); });
    document.getElementById("add-python").addEventListener("click", () => { nb.cells.push({type: "python", source: ""}); render(); });
    document.getElementById("add-r").addEventListener("click", () => { nb.cells.push({type: "r", source: ""}); render(); });
    document.getElementById("save").addEventListener("click", save);

    // Panel fold + overlay rule (REQ-30): folded via the rail; scrim below 1280px.
    const panel = document.getElementById("panel");
    const scrim = document.getElementById("scrim");
    document.getElementById("files-btn").addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      scrim.classList.toggle("open", !panel.hidden && window.innerWidth < 1280);
    });
    scrim.addEventListener("click", () => { panel.hidden = true; scrim.classList.remove("open"); });

    render();
  </script>
</body>
</html>
