{% extends "base.html" %}
{% block content %}
  <h1 class="wordmark">pe<span class="brace">{</span>b<span class="brace">}</span>les</h1>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
  <p class="status">Your Pebbles password is your UNIX password — the same one SSH uses.</p>
{% endblock %}
